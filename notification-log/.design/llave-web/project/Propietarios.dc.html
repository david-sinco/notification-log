<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Propietarios · Llave</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B6B4A}a:hover{color:#084D36}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1300px; background: #F3F5F1; color: #101A16; font-family: 'Onest', system-ui, sans-serif; font-size: 15px; line-height: 1.45">
<div style="flex: 1 1 232px; background: #101A16">
<dc-import name="Nav" active="owners" hint-size="100%,760px"></dc-import>
</div>
<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 36px clamp(16px, 4vw, 44px) 64px">
<div style="max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">

<header style="display: flex; flex-direction: column; gap: 6px">
<div style="font: 500 12px/1.4 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #56615B">Arriendos</div>
<h1 style="margin: 0; font: 700 clamp(30px, 4.4vw, 44px)/1.02 'Bricolage Grotesque', sans-serif; letter-spacing: -0.025em">Propietarios</h1>
<p style="margin: 0; color: #56615B">Personas naturales o jurídicas a cuyo nombre quedan las publicaciones.</p>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

<section aria-label="Lista de propietarios" style="flex: 3 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<label for="owner-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Buscar propietario</label>
<input id="owner-search" type="search" value="{{search}}" onChange="{{onSearch}}" placeholder="Nombre, razón social o documento" style="flex: 1 1 220px; min-height: 46px; padding: 0 16px; box-sizing: border-box; border-radius: 12px; border: 1px solid #C5CCC4; background: #FFFFFF; font: 400 15px 'Onest', sans-serif; color: #101A16">
<div role="group" aria-label="Tipo" style="display: flex; gap: 4px; padding: 4px; border-radius: 12px; background: #E4E8E2">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="min-height: 38px; padding: 0 14px; border: 0; border-radius: 9px; background: {{f.bg}}; color: #101A16; font: 600 14px 'Onest', sans-serif; cursor: pointer">{{f.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{owners}}" as="o" hint-placeholder-count="5">
<article style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DFE4DD">
<span aria-hidden="true" style="flex: none; display: flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: {{o.radius}}; background: {{o.avatarBg}}; color: {{o.avatarFg}}; font-weight: 600">{{o.initials}}</span>
<div style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font-weight: 600">{{o.name}}</span>
<span style="display: inline-flex; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #E9ECE7; color: #3F4A44">{{o.typeLabel}}</span>
</span>
<span style="font: 400 13px 'JetBrains Mono', monospace; color: #56615B">{{o.doc}}</span>
<span style="font-size: 14px; color: #56615B; overflow-wrap: anywhere">{{o.email}} · {{o.phone}}</span>
</div>
<a href="Publicaciones.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 600">{{o.listings}}</a>
</article>
</sc-for>
</div>
</section>

<section aria-label="Registrar propietario" style="flex: 2 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 22px; border-radius: 18px; background: #FFFFFF; border: 1px solid #DFE4DD">
<h2 style="margin: 0; font: 700 22px/1.2 'Bricolage Grotesque', sans-serif">Registrar propietario</h2>
<div role="group" aria-label="Tipo de propietario" style="display: flex; gap: 8px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="2">
<button type="button" aria-pressed="{{k.pressed}}" onClick="{{k.pick}}" style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-height: 68px; padding: 10px 14px; border-radius: 14px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font-family: 'Onest', sans-serif; text-align: left; cursor: pointer">
<span style="font-weight: 600; font-size: 15px">{{k.label}}</span>
<span style="font-size: 12px">{{k.hint}}</span>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 14px">
<sc-if value="{{isNatural}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="doc-type" style="font-size: 13px; font-weight: 600">Tipo de documento</label>
<select id="doc-type" style="min-height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #C5CCC4; background: #FFFFFF; font: 400 15px 'Onest', sans-serif; color: #101A16">
<option>Cédula de ciudadanía</option>
<option>Cédula de extranjería</option>
<option>Pasaporte</option>
</select>
</div>
</sc-if>
<sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="{{f.id}}" style="font-size: 13px; font-weight: 600">{{f.label}}</label>
<input id="{{f.id}}" type="{{f.type}}" placeholder="{{f.placeholder}}" style="min-height: 46px; padding: 0 14px; box-sizing: border-box; width: 100%; border-radius: 12px; border: 1px solid #C5CCC4; background: #FFFFFF; font: 400 15px 'Onest', sans-serif; color: #101A16">
</div>
</sc-for>
</div>
<span style="font-size: 13px; color: #56615B">El correo y el teléfono se usan para avisarle de visitas y cambios de estado.</span>
<button type="button" style="min-height: 46px; border: 0; border-radius: 12px; background: #101A16; color: #FFFFFF; font: 600 14px 'Onest', sans-serif; cursor: pointer">{{submitLabel}}</button>
</section>

</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1360,"height":1300}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { kind: 'Natural', filter: 'all', search: '' };
}
renderVals() {
const s = this.state;
const raw = [
['Natural', 'Camila Ramírez Ospina', 'CC 1.036.554.210', 'c.ramirez@correo.co', '+57 300 555 0142', '3 publicaciones'],
['Company', 'Inmobiliaria Andes S.A.S.', 'NIT 901.223.118-4', 'contacto@andes.co', '+57 604 555 0190', '11 publicaciones'],
['Natural', 'Julián Ortiz Mejía', 'CC 71.224.905', 'j.ortiz@correo.co', '+57 311 555 0177', '1 publicación'],
['Natural', 'Hannah Becker', 'Pasaporte C4F81X22', 'h.becker@correo.co', '+57 320 555 0108', '2 publicaciones'],
['Company', 'Constructora Río Claro S.A.', 'NIT 800.145.662-1', 'ventas@rioclaro.co', '+57 602 555 0164', '6 publicaciones'],
];
const q = s.search.trim().toLowerCase();
const field = (id, label, type, placeholder) => ({ id, label, type, placeholder });
const contact = [field('o-email', 'Correo', 'email', 'nombre@correo.co'), field('o-phone', 'Teléfono', 'tel', '+57 300 000 0000')];
return {
search: s.search,
onSearch: (e) => this.setState({ search: e.target.value }),
filters: [['all', 'Todos'], ['Natural', 'Naturales'], ['Company', 'Jurídicas']].map(([k, label]) => ({ label, pressed: s.filter === k ? 'true' : 'false', bg: s.filter === k ? '#FFFFFF' : 'transparent', pick: () => this.setState({ filter: k }) })),
owners: raw.filter((o) => (s.filter === 'all' || o[0] === s.filter) && (!q || (o[1] + ' ' + o[2]).toLowerCase().includes(q))).map(([type, name, doc, email, phone, listings]) => ({
name, doc, email, phone, listings,
typeLabel: type === 'Natural' ? 'Persona natural' : 'Persona jurídica',
initials: name.split(' ').slice(0, 2).map((w) => w[0]).join(''),
radius: type === 'Natural' ? '999px' : '12px', avatarBg: type === 'Natural' ? '#C9F26B' : '#101A16', avatarFg: type === 'Natural' ? '#101A16' : '#FFFFFF',
})),
kinds: [['Natural', 'Persona natural', 'Nombres y documento'], ['Company', 'Persona jurídica', 'Razón social y NIT']].map(([k, label, hint]) => ({
label, hint, pressed: s.kind === k ? 'true' : 'false', bg: s.kind === k ? '#101A16' : '#FFFFFF', fg: s.kind === k ? '#FFFFFF' : '#101A16', border: s.kind === k ? '#101A16' : '#C5CCC4',
pick: () => this.setState({ kind: k }),
})),
isNatural: s.kind === 'Natural',
fields: (s.kind === 'Natural'
? [field('o-doc', 'Número de documento', 'text', '1.036.554.210'), field('o-first', 'Nombres', 'text', 'Camila'), field('o-last', 'Apellidos', 'text', 'Ramírez Ospina')]
: [field('o-legal', 'Razón social', 'text', 'Inmobiliaria Andes S.A.S.'), field('o-nit', 'NIT', 'text', '901.223.118-4')]).concat(contact),
submitLabel: s.kind === 'Natural' ? 'Registrar persona natural' : 'Registrar persona jurídica',
};
}
}
</script>
</body>
</html>
