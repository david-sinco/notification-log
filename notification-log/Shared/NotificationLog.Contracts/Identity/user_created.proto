syntax = "proto3";

package Identity.identity;

option csharp_namespace = "NotificationLog.Contracts.Identity";

import "google/protobuf/timestamp.proto";

message UserCreated {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string user_id = 10;
  string name = 11;
  string email = 12;
  string phone = 13;
  string locale = 14;
  string time_zone = 15;
  bool accepts_notifications = 16;
}
