syntax = "proto3";

package Identity.identity;

option csharp_namespace = "NotificationLog.Contracts.Identity";

import "google/protobuf/timestamp.proto";

message AdvisorChanged {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  int32 schema_version = 3;

  string advisor_id = 10;
  bool is_active = 11;
  repeated string service_cities = 12;
  int32 capacity = 13;
}
